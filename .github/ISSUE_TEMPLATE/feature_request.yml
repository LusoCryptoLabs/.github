name: Feature request
description: Propose something new. We agree on it here before anyone opens a pull request.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you open the pull request?
      options:
        - "Yes"
        - Maybe, with some guidance
        - "No"
    validations:
      required: true
